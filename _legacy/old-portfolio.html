<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mainframe®</title>
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium">
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --font-heading:'HelveticaNowDisplay-Medium','Helvetica Neue',Arial,sans-serif;
    --font-body:'HelveticaNowDisplayW01-Rg','Helvetica Neue',Arial,sans-serif;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);}
  @keyframes mf-blink{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes mf-pills-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .root{position:relative;min-height:100vh;background:var(--bg);}

  /* Character video */
  .hero-video{
    position:fixed;top:0;left:12vw;z-index:0;
    width:77vw;height:100%;
    object-fit:contain;object-position:center;
    transform:translateY(2%);
    clip-path:inset(6px 6px 16px 6px);
  }

  /* Top nav */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:10;
    padding:16px 20px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .logo-wrap{display:flex;align-items:center;gap:12px;}
  .logo{font-family:var(--font-heading);font-weight:500;font-size:21px;letter-spacing:-0.02em;color:#000;}
  .asterisk{font-size:25px;color:#000;user-select:none;letter-spacing:-0.02em;}
  .nav-links{display:none;align-items:center;gap:0;font-size:23px;color:#000;}
  .nav-links a{color:#000;text-decoration:none;transition:opacity .2s;}
  .nav-links a:hover{opacity:.6;}
  .nav-sep{color:#000;}

  .hamburger{background:none;border:none;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:5px;}
  .hamburger span{width:24px;height:2px;background:#000;transition:all .3s;}
  .nav.open .hamburger span:nth-child(1){transform:rotate(45deg) translateY(7px);}
  .nav.open .hamburger span:nth-child(2){opacity:0;}
  .nav.open .hamburger span:nth-child(3){transform:rotate(-45deg) translateY(-7px);}

  /* Mobile overlay */
  .overlay{
    position:fixed;inset:0;z-index:9;
    background:rgba(255,255,255,.95);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
    padding:0 32px;gap:32px;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .overlay a{font-family:var(--font-body);font-size:32px;font-weight:500;color:#000;text-decoration:none;}
  .overlay a.contact{text-decoration:underline;text-underline-offset:2px;}

  /* Hero */
  .hero{
    position:relative;z-index:1;height:100vh;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 20px 48px;overflow:hidden;
  }
  .hero-inner{max-width:576px;position:relative;z-index:10;}

  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(0,0,0,.55);margin-bottom:14px;
  }
  .status .dot{width:6px;height:6px;border-radius:999px;background:#12b76a;display:inline-block;box-shadow:0 0 0 3px rgba(18,183,106,.15);}

  .intro-blur{
    margin-bottom:20px;
    font-size:clamp(18px,4vw,26px);line-height:1.3;font-weight:400;color:#000;
    position:relative;
  }
  .typed{
    color:#000;margin:0 0 20px 0;
    font-size:clamp(18px,4vw,26px);line-height:1.35;font-weight:400;min-height:54px;
  }
  .caret{display:inline-block;width:2px;height:1.1em;background:#000;vertical-align:middle;margin-left:2px;animation:mf-blink 1s step-end infinite;}
  .caret.hidden{display:none;}

  /* Ask agents glass button */
  .ask{
    position:relative;display:inline-flex;align-items:center;gap:14px;
    padding:8px 22px 8px 8px;border-radius:999px;border:none;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(30px) saturate(220%) brightness(1.08);
    -webkit-backdrop-filter:blur(30px) saturate(220%) brightness(1.08);
    box-shadow:0 1px 0 .5px rgba(255,255,255,.9) inset, 0 -1px 0 .5px rgba(255,255,255,.25) inset, 0 0 0 .5px rgba(255,255,255,.35) inset, 0 12px 40px -6px rgba(0,0,0,.18), 0 4px 10px -2px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    cursor:pointer;margin-bottom:14px;font-family:var(--font-body);overflow:hidden;isolation:isolate;
  }
  .ask .orb{
    width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 25%, #4a4a52 0%, #1a1a1e 55%, #050506 100%);
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.25), 0 2px 4px rgba(0,0,0,.2);
  }
  .ask .label{font-size:22px;color:#0e0e10;letter-spacing:-0.01em;}
  .ask .sheen{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:999px;background:linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.15) 30%, rgba(255,255,255,0) 55%, rgba(255,255,255,.08) 85%, rgba(255,255,255,.4) 100%);pointer-events:none;mix-blend-mode:overlay;}
  .ask .sheen2{position:absolute;top:2px;left:20%;right:20%;height:32%;border-radius:999px;background:linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 100%);pointer-events:none;filter:blur(1px);}

  /* Action pills */
  .pills{display:flex;flex-wrap:wrap;gap:4px 0;opacity:0;animation:mf-pills-in .4s ease .4s forwards;}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;
    background:#fff;color:#000;border:1px solid rgba(0,0,0,.1);border-radius:999px;
    font-size:13px;padding:.3em 16px;margin:0 3px 6px 3px;white-space:nowrap;
    text-decoration:none;transition:background-color .2s,color .2s;cursor:pointer;
    font-family:var(--font-body);
  }
  .pill:hover{background:#000;color:#fff;}
  .pill.outline{gap:8px;background:transparent;}
  .pill.outline svg{width:12px;height:12px;}

  /* Bottom floating nav */
  .tabs{
    position:fixed;right:20px;top:16px;z-index:11;
    display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 8px 32px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .tab{
    display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;
    border:none;cursor:pointer;background:transparent;color:#0e0e10;
    transition:background-color .2s,color .2s;
  }
  .tab.active{background:#0e0e10;color:#fff;}
  .tab .tab-label{font-family:var(--font-body);font-size:13px;letter-spacing:.01em;}

  /* >=640px */
  @media (min-width:640px){
    .nav{padding:20px 32px;}
    .logo{font-size:26px;}
    .asterisk{font-size:30px;}
    .hero{padding-left:32px;padding-right:32px;}
    .intro-blur{margin-bottom:24px;}
    .typed{margin-bottom:24px;}
    .pill{font-size:15px;padding:.3em 20px;}
    .pill.outline{gap:12px;}
  }

  /* >=768px */
  @media (min-width:768px){
    .nav-links{display:flex;}
    .hamburger,.overlay{display:none;}
    .hero{justify-content:center;padding:0 40px;}
  }
</style>
</head>
<body>
<div class="root">
  <video class="hero-video" src="girl_animation.mp4" muted playsinline preload="auto"></video>

  <nav class="nav" id="nav">
    <div class="logo-wrap">
      <span class="logo">Mainframe®</span>
      <span class="asterisk">✳︎</span>
    </div>
    <div class="nav-links">
      <a href="#">Labs</a><span class="nav-sep">,&nbsp;</span>
      <a href="#">Studio</a><span class="nav-sep">,&nbsp;</span>
      <a href="#">Openings</a><span class="nav-sep">,&nbsp;</span>
      <a href="#">Shop</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="overlay" id="overlay">
    <a href="#">Labs</a>
    <a href="#">Studio</a>
    <a href="#">Openings</a>
    <a href="#">Shop</a>
    <a href="#" class="contact">Get in touch</a>
  </div>

  <section class="hero" id="home">
    <div class="hero-inner">
      <div class="status">
        <span class="dot"></span>
        <span>a.r.i.a &middot; online</span>
      </div>

      <div class="intro-blur">
        Hey there, meet A.R.I.A,<br>Mainframe's Adaptive Response Interface Agent
      </div>

      <p class="typed"><span id="typed-text"></span><span class="caret" id="caret"></span></p>

      <button type="button" class="ask">
        <span class="orb">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sparkG" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffd36e"></stop>
                <stop offset="0.5" stop-color="#ff7ab6"></stop>
                <stop offset="1" stop-color="#6aa8ff"></stop>
              </linearGradient>
            </defs>
            <path d="M12 2 L13.6 10.4 L22 12 L13.6 13.6 L12 22 L10.4 13.6 L2 12 L10.4 10.4 Z" fill="url(#sparkG)"></path>
          </svg>
        </span>
        <span class="label">Ask agents</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0e0e10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:-4px;"><path d="M6 9l6 6 6-6"></path></svg>
        <span class="sheen" aria-hidden="true"></span>
        <span class="sheen2" aria-hidden="true"></span>
      </button>

      <div class="pills">
        <a href="#" class="pill">Pitch us an idea</a>
        <a href="#" class="pill">Come work here</a>
        <a href="#" class="pill">Send a brief hello</a>
        <a href="#" class="pill">See how we operate</a>
        <button class="pill outline" id="copy-email">
          <span>Reach us: <span style="text-decoration:underline;text-underline-offset:1px;">hello@mainframe.co</span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="1.5"></rect><path d="M4 16V4a1 1 0 0 1 1-1h12"></path></svg>
        </button>
      </div>
    </div>
  </section>

  <nav class="tabs" aria-label="Sections">
    <button class="tab active" data-tab="home" aria-label="Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab" data-tab="work" aria-label="Work">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 19a5 5 0 0 1-5-5v8"></path><path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5"></path><circle cx="13" cy="12" r="2"></circle><circle cx="20" cy="19" r="2"></circle></svg>
      <span class="tab-label">Work</span>
    </button>
    <button class="tab" data-tab="about" aria-label="About">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span class="tab-label">About</span>
    </button>
    <button class="tab" data-tab="contact" aria-label="Contact">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.54 21.69a.5.5 0 0 0 .93-.02l6.5-19a.5.5 0 0 0-.64-.63l-19 6.5a.5.5 0 0 0-.02.93l7.93 3.18a2 2 0 0 1 1.11 1.11z"></path><path d="M21.85 2.15 10.91 13.09"></path></svg>
      <span class="tab-label">Contact</span>
    </button>
  </nav>
</div>

<script>
(function(){
  // Typewriter
  var fullText = "Glad you stopped in. Good taste tends to find us. Now, what are we building?";
  var typedEl = document.getElementById('typed-text');
  var caret = document.getElementById('caret');
  setTimeout(function(){
    var i = 0;
    var iv = setInterval(function(){
      i++;
      typedEl.textContent = fullText.slice(0, i);
      if (i >= fullText.length){ clearInterval(iv); caret.classList.add('hidden'); }
    }, 38);
  }, 600);

  // Mobile menu
  var nav = document.getElementById('nav');
  var overlay = document.getElementById('overlay');
  document.getElementById('hamburger').addEventListener('click', function(){
    var open = !overlay.classList.contains('open');
    overlay.classList.toggle('open', open);
    nav.classList.toggle('open', open);
  });
  overlay.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ overlay.classList.remove('open'); nav.classList.remove('open'); });
  });

  // Bottom tabs
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
    });
  });

  // Copy email
  document.getElementById('copy-email').addEventListener('click', function(){
    if (navigator.clipboard) navigator.clipboard.writeText('hello@mainframe.co');
  });

  // Mouse-scrubbed character video: cursor X across the screen maps directly
  // to a point on the video timeline, so the character animates as you move.
  var video = document.querySelector('.hero-video');
  var targetTime = null, seeking = false;

  video.addEventListener('loadedmetadata', function(){
    try { video.pause(); video.currentTime = 0; } catch(e){}
  });
  // When a seek finishes, jump to the latest target if the cursor moved on.
  video.addEventListener('seeked', function(){
    if (targetTime != null && Math.abs(video.currentTime - targetTime) > 0.02){
      try { video.currentTime = targetTime; } catch(e){}
    } else {
      seeking = false;
    }
  });

  function scrubTo(clientX){
    if (!video.duration || isNaN(video.duration)) return;
    var frac = Math.max(0, Math.min(1, clientX / window.innerWidth));
    targetTime = frac * video.duration;
    if (!seeking){
      seeking = true;
      try { video.currentTime = targetTime; } catch(e){}
    }
  }

  window.addEventListener('mousemove', function(e){ scrubTo(e.clientX); });
  // Touch support (mobile drag)
  window.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length) scrubTo(e.touches[0].clientX);
  }, { passive: true });
})();
</script>
</body>
</html>
